name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the manifest version
        run: |
          version=$(jq -r .version custom_components/maico_kwl/manifest.json)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "manifest has $version, tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
